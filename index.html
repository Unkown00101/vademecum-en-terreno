<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vademécum APS Coquimbo</title>
<meta name="description" content="Arsenal Farmacológico APS del Servicio de Salud Coquimbo. Consulta sin conexión para CESFAM, SAPU/SAR y postas rurales.">
<meta name="theme-color" content="#0C2830">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="estilos-plus.css">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vademécum APS">
<style>
:root{
  --petroleo:#0C2830;
  --petroleo-2:#16414C;
  --teal:#1F6273;
  --teal-claro:#E2EDEF;
  --papel:#E8EDED;
  --carta:#FFFFFF;
  --tinta:#12222A;
  --tinta-2:#4E626D;
  --tinta-3:#7B8D96;
  --linea:#CDD9DC;
  --linea-fuerte:#A9BCC2;
  --si:#136A46;
  --si-fondo:#E4F1EA;
  --cond:#8A5200;
  --cond-fondo:#FAEEDD;
  --no:#9E2B25;
  --no-fondo:#FAE7E5;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px;
  --sombra:0 1px 2px rgba(18,34,42,.08),0 4px 14px rgba(18,34,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--papel);
  color:var(--tinta);
  font-size:16px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}

/* ---------- tipografía utilitaria ---------- */
.rotulo{
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-3);
}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.oculto{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- encabezado ---------- */
header.app{
  position:sticky;top:0;z-index:40;
  background:var(--petroleo);color:#EAF2F3;
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;
  box-shadow:0 2px 10px rgba(12,40,48,.22);
}
.marca{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.marca h1{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0}
.marca .res{font-family:var(--mono);font-size:10.5px;color:#8FB3BB;letter-spacing:.02em}
.barra-estab{display:flex;align-items:center;gap:8px;margin:9px 0 0;padding-bottom:10px}
.selector-estab{
  flex:1;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:7px 12px;color:#EAF2F3;font-size:13.5px;font-weight:550;
  min-width:0;
}
.selector-estab select{
  appearance:none;background:none;border:none;color:#fff;font-weight:600;
  font-size:13.5px;flex:1;min-width:0;padding:0;cursor:pointer;
}
.selector-estab select option{color:#12222A}
.punto-red{
  width:9px;height:9px;border-radius:50%;background:#5FC38C;flex:none;
  box-shadow:0 0 0 3px rgba(95,195,140,.2);
}
.punto-red.offline{background:#E0A458;box-shadow:0 0 0 3px rgba(224,164,88,.2)}

/* ---------- buscador ---------- */
.zona-busqueda{background:var(--petroleo);padding:0 14px 12px}
.caja-busqueda{
  display:flex;align-items:center;gap:10px;background:#fff;border-radius:var(--r);
  padding:11px 13px;box-shadow:0 2px 8px rgba(12,40,48,.18);
}
.caja-busqueda input{
  flex:1;border:none;outline:none;font-size:16px;min-width:0;background:none;
}
.caja-busqueda input::placeholder{color:var(--tinta-3)}
.icono{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.btn-limpiar{color:var(--tinta-3);display:flex;padding:2px}

.chips{display:flex;gap:7px;overflow-x:auto;padding:11px 14px 3px;margin:0 -14px -3px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:550;
  background:rgba(255,255,255,.10);color:#C3D8DC;border:1px solid transparent;white-space:nowrap;
}
.chip[aria-pressed="true"]{background:#fff;color:var(--petroleo);font-weight:650}

/* ---------- contenedor ---------- */
main{max-width:760px;margin:0 auto;padding:14px}
.vista{display:none}
.vista.activa{display:block}

/* ---------- listado de resultados ---------- */
.meta-resultados{display:flex;justify-content:space-between;align-items:baseline;
  margin:2px 4px 9px;gap:10px}
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.fila{
  display:flex;align-items:stretch;gap:0;background:var(--carta);border-radius:var(--r);
  box-shadow:var(--sombra);overflow:hidden;text-align:left;width:100%;
  border:1px solid transparent;transition:border-color .12s;
}
.fila:hover{border-color:var(--linea-fuerte)}
.fila .marca-estado{width:5px;flex:none;background:var(--linea-fuerte)}
.fila.si .marca-estado{background:var(--si)}
.fila.cond .marca-estado{background:var(--cond)}
.fila.no .marca-estado{background:var(--no)}
.fila .cuerpo{padding:11px 13px;flex:1;min-width:0}
.fila .nombre{font-weight:640;font-size:15.5px;letter-spacing:-.005em;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fila .sub{display:block;font-size:12.5px;color:var(--tinta-2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .cond-linea{display:block;font-size:12px;margin-top:5px;font-weight:600}
.fila.si .cond-linea{color:var(--si)}
.fila.cond .cond-linea{color:var(--cond)}
.fila.no .cond-linea{color:var(--no)}
.insignia{
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;background:var(--teal-claro);color:var(--teal);
  white-space:nowrap;
}
.insignia.alerta{background:var(--no-fondo);color:var(--no)}
.insignia.paro{background:#FCE9E7;color:#8C2119}

/* ---------- estado vacío / arranque ---------- */
.tarjeta{background:var(--carta);border-radius:var(--r);box-shadow:var(--sombra);
  padding:15px;margin-bottom:12px}
.tarjeta h2{font-size:13.5px;margin:0 0 10px;font-weight:680;letter-spacing:-.005em}
.rejilla-cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
.btn-cat{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 11px;border-radius:8px;background:#F2F6F7;border:1px solid var(--linea);
  font-size:13px;font-weight:550;text-align:left;
}
.btn-cat .n{font-family:var(--mono);font-size:11.5px;color:var(--tinta-3)}
.btn-cat:hover{border-color:var(--teal);background:var(--teal-claro)}

.resumen-estab{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linea);
  border-radius:8px;overflow:hidden;margin-top:4px}
.resumen-estab div{background:#F7FAFA;padding:10px 8px;text-align:center}
.resumen-estab .cifra{font-family:var(--mono);font-size:19px;font-weight:600;
  letter-spacing:-.02em;display:block;line-height:1.15}
.resumen-estab .et{font-size:10.5px;color:var(--tinta-2);line-height:1.25;display:block;margin-top:3px}

.vacio{text-align:center;padding:34px 18px;color:var(--tinta-2)}
.vacio strong{display:block;color:var(--tinta);font-size:15px;margin-bottom:5px}

/* ---------- ficha ---------- */
.ficha-cabecera{margin-bottom:12px}
.btn-volver{display:inline-flex;align-items:center;gap:6px;color:var(--teal);
  font-size:13.5px;font-weight:600;margin-bottom:9px}
.ficha-cabecera h2{font-size:23px;line-height:1.15;margin:0;letter-spacing:-.02em;font-weight:680}
.ficha-cabecera .alias{font-size:12.5px;color:var(--tinta-2);margin-top:4px}
.taxonomia{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tax{font-size:11.5px;padding:3px 8px;border-radius:5px;background:#DDE6E8;color:var(--tinta-2);
  font-weight:550}

/* banda de veredicto: elemento firma */
.veredicto{
  border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra);margin-bottom:12px;
  border-left:6px solid var(--linea-fuerte);background:var(--carta);
}
.veredicto.si{border-left-color:var(--si)}
.veredicto.cond{border-left-color:var(--cond)}
.veredicto.no{border-left-color:var(--no)}
.veredicto .encabezado{padding:12px 14px 11px}
.veredicto.si .encabezado{background:var(--si-fondo)}
.veredicto.cond .encabezado{background:var(--cond-fondo)}
.veredicto.no .encabezado{background:var(--no-fondo)}
.veredicto .lugar{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  opacity:.75}
.veredicto .titular{font-size:17.5px;font-weight:690;letter-spacing:-.015em;margin-top:3px;
  line-height:1.25}
.veredicto.si .lugar,.veredicto.si .titular{color:var(--si)}
.veredicto.cond .lugar,.veredicto.cond .titular{color:var(--cond)}
.veredicto.no .lugar,.veredicto.no .titular{color:var(--no)}
.condiciones{list-style:none;margin:0;padding:0}
.condiciones li{
  padding:10px 14px;border-top:1px solid var(--linea);font-size:13.5px;
  display:flex;gap:9px;align-items:flex-start;
}
.condiciones li .cl{font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-3);flex:none;
  width:78px;padding-top:2px}
.condiciones li b{font-weight:640}

/* presentaciones */
.grupo-arsenal{margin-bottom:9px}
.grupo-arsenal > .rotulo{display:block;margin:0 4px 6px}
.pres{border:1px solid var(--linea);border-radius:8px;background:var(--carta);
  padding:11px 12px;margin-bottom:6px}
.pres.propia{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.pres .linea1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pres .forma{font-weight:620;font-size:14.5px}
.pres .conc{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}
.pres .linea2{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.pres .isp{font-family:var(--mono);font-size:11px;color:var(--tinta-3);letter-spacing:.01em}
.pres .obs{font-size:12.5px;color:var(--tinta-2);margin-top:7px;
  padding-top:7px;border-top:1px dashed var(--linea);line-height:1.4}
.pres .obs b{color:var(--tinta);font-weight:620}
.etq{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:4px;
  background:#EDF2F3;color:var(--tinta-2)}
.etq.prog{background:var(--teal-claro);color:var(--teal)}
.etq.cont{background:var(--cond-fondo);color:var(--cond)}
.etq.paro{background:#FCE9E7;color:#8C2119}
.etq.sr{background:var(--no-fondo);color:var(--no)}

/* alternativas */
.alt{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;background:#F2F6F7;
  border:1px solid var(--linea);border-radius:8px;margin-bottom:6px;font-size:13px}
.alt .flecha{color:var(--teal);flex:none;font-weight:700}

/* sección clínica orientativa */
.orientativo{border:1px solid var(--linea);border-radius:var(--r);background:var(--carta);
  overflow:hidden;margin-bottom:12px}
.orientativo > summary{
  padding:13px 14px;cursor:pointer;list-style:none;display:flex;align-items:center;
  justify-content:space-between;gap:10px;font-weight:620;font-size:14px;
}
.orientativo > summary::-webkit-details-marker{display:none}
.orientativo[open] > summary{border-bottom:1px solid var(--linea)}
.orientativo .aviso{
  background:var(--cond-fondo);color:var(--cond);font-size:12.5px;padding:10px 14px;
  border-bottom:1px solid var(--linea);line-height:1.4;
}
.campo{padding:11px 14px;border-bottom:1px solid var(--linea)}
.campo:last-child{border-bottom:none}
.campo .rotulo{display:block;margin-bottom:3px}
.campo p{margin:0;font-size:13.5px;line-height:1.45}

/* nota fuente */
.pie-fuente{font-size:11.5px;color:var(--tinta-3);padding:12px 4px 4px;line-height:1.5}
.pie-fuente code{font-family:var(--mono);font-size:11px}

/* ---------- carro de paro ---------- */
.progreso{height:7px;background:var(--linea);border-radius:99px;overflow:hidden;margin-top:9px}
.progreso i{display:block;height:100%;background:var(--si);transition:width .25s}
.item-paro{background:var(--carta);border-radius:8px;box-shadow:var(--sombra);
  padding:11px 12px;margin-bottom:6px}
.item-paro .fila1{display:flex;gap:10px;align-items:flex-start}
.item-paro input[type=checkbox]{width:21px;height:21px;flex:none;margin-top:2px;
  accent-color:var(--si)}
.item-paro .txt{flex:1;min-width:0}
.item-paro .nom{font-weight:620;font-size:14.5px}
.item-paro .det{font-family:var(--mono);font-size:12px;color:var(--tinta-2);margin-top:2px}
.item-paro .campos{display:grid;grid-template-columns:1fr 1fr 78px;gap:6px;margin-top:9px}
.item-paro label{display:block}
.item-paro label span{font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--tinta-3);display:block;margin-bottom:2px}
.item-paro input[type=text],.item-paro input[type=month],.item-paro input[type=number]{
  width:100%;border:1px solid var(--linea);border-radius:6px;padding:6px 8px;
  font-family:var(--mono);font-size:13px;background:#FBFCFC;
}
.item-paro.vence input[type=month]{border-color:var(--no);background:var(--no-fondo);color:var(--no)}
.item-paro.hecho{opacity:.98}
.item-paro.hecho .nom{text-decoration:none}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 15px;border-radius:8px;font-size:14px;font-weight:620;
  background:var(--petroleo);color:#fff;
}
.btn.secundario{background:var(--carta);color:var(--tinta);border:1px solid var(--linea-fuerte)}
.btn.peligro{background:var(--carta);color:var(--no);border:1px solid var(--no)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- guía ---------- */
.def{margin:0}
.def div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:13.5px}
.def div:last-child{border-bottom:none}
.def dt{font-family:var(--mono);font-weight:650;flex:none;width:88px;font-size:12.5px}
.def dd{margin:0;color:var(--tinta-2)}
.notas-pie{counter-reset:n;margin:0;padding:0;list-style:none}
.notas-pie li{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--linea);
  font-size:13px;line-height:1.4}
.notas-pie li:last-child{border-bottom:none}
.notas-pie .num{font-family:var(--mono);font-weight:700;color:var(--teal);flex:none;width:18px}

/* ---------- navegación inferior ---------- */
nav.inferior{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--carta);
  border-top:1px solid var(--linea);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(18,34,42,.07);
}
nav.inferior button{
  flex:1;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--tinta-3);font-size:10.5px;font-weight:620;letter-spacing:.01em;
}
nav.inferior button[aria-current="page"]{color:var(--teal)}
nav.inferior .icono{width:21px;height:21px;stroke-width:1.9}
nav.inferior .pastilla{
  position:absolute;top:4px;right:calc(50% - 22px);background:var(--no);color:#fff;
  font-family:var(--mono);font-size:9px;font-weight:700;border-radius:99px;padding:1px 4px;
}
nav.inferior button{position:relative}

/* ---------- avisos ---------- */
.aviso-instalar{
  background:var(--petroleo-2);color:#DCEAEC;border-radius:var(--r);padding:12px 14px;
  margin-bottom:12px;font-size:13px;display:flex;gap:11px;align-items:center;
}
.aviso-instalar .btn{padding:7px 12px;font-size:13px;background:#fff;color:var(--petroleo);flex:none}

/* ---------- impresión ---------- */
@media print{
  body{background:#fff;padding:0;font-size:11pt}
  header.app,nav.inferior,.zona-busqueda,.btn-volver,.acciones,.aviso-instalar,
  .chips,.no-imprimir{display:none !important}
  main{max-width:none;padding:0}
  .tarjeta,.pres,.item-paro,.veredicto,.orientativo{box-shadow:none;border:1px solid #999;
    break-inside:avoid;page-break-inside:avoid}
  .orientativo[open] > summary{border-bottom:1px solid #999}
  details{display:block}
  details > summary{list-style:none}
  .orientativo > *:not(summary){display:block !important}
  a[href]:after{content:""}
}

@media (min-width:700px){
  body{padding-bottom:24px}
  nav.inferior{position:sticky;top:0;bottom:auto;order:-1;border-top:none;
    border-bottom:1px solid var(--linea);box-shadow:none;
    max-width:760px;margin:0 auto;border-radius:0 0 var(--r) var(--r);}
  nav.inferior button{flex-direction:row;gap:7px;font-size:13px;padding:11px 8px}
  nav.inferior .pastilla{position:static;margin-left:1px}
  .item-paro .campos{grid-template-columns:1fr 160px 90px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<header class="app">
  <div class="marca">
    <img class="logo-illapel" src="logo-illapel.png" alt="Municipalidad de Illapel">
    <div class="marca-texto">
      <h1>Vademécum APS</h1>
      <span class="institucion">Departamento de Salud Municipal de Illapel · Equipo de Salud Rural</span>
      <span class="res mono">RES. 2504243202 · 11-09-2025 · SS COQUIMBO</span>
    </div>
  </div>
  <div class="barra-estab">
    <label class="selector-estab">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13M10 21v-5h4v5"/></svg>
      <span class="sr">Mi establecimiento</span>
      <select id="selEstab">
        <option value="2">Posta de salud rural</option>
        <option value="0">CESFAM / Centro de salud APS</option>
        <option value="1">SAPU / SAR (urgencia APS)</option>
      </select>
      <svg class="icono" viewBox="0 0 24 24" style="width:14px;height:14px" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </label>
    <span class="punto-red" id="puntoRed" title="Estado de la conexión"></span>
  </div>
</header>

<div class="zona-busqueda" id="zonaBusqueda">
  <div class="caja-busqueda">
    <svg class="icono" viewBox="0 0 24 24" style="color:#7B8D96" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label class="sr" for="q">Buscar en el arsenal</label>
    <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
           placeholder="Medicamento, forma, registro ISP, GES…">
    <button class="btn-limpiar oculto" id="btnLimpiar" aria-label="Borrar la búsqueda">
      <svg class="icono" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="chips" id="chipsFiltro" role="group" aria-label="Filtros rápidos"></div>
</div>

<nav class="inferior" aria-label="Secciones">
  <button data-ruta="buscar" aria-current="page">
    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    Buscar</button>
  <button data-ruta="carro">
    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M12 11v5M9.5 13.5h5"/></svg>
